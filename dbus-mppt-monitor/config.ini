; Victron MPPT monitor (monitor only, kept out of DVCC) - settings
; Restart the monitor after editing:  svc -t /service/dbus-mppt-monitor
;
; This is a MONITOR ONLY: it opens the VE.Direct port read-only and never sends the MPPT
; anything, so nothing here can change how the MPPT charges.

[vedirect]
; Which VE.Direct port the MPPT is on.
;   auto  = find it: plug the MPPT into any VE.Direct port; Venus OS's own driver identifies it
;           first, then the monitor takes the port over and remembers it (in state.json).
;           With a one-way cable Victron's driver can't identify it, so after 30 s the monitor
;           listens (read-only) on the ports where Victron's driver found nothing.
;   ttyS5, ttyS6 or ttyS7 = one of the Cerbo GX's built-in VE.Direct ports
;   /dev/serial/by-id/...  = a VE.Direct-to-USB cable (this name stays the same between restarts)
; "Cerbo Setup.bat" option 2 (or: dbus-mppt-monitor.py --scan) shows what is on each port.
port = auto
; The MPPT's serial number (on its label, or in VictronConnect under Product info, for
; example HQ2245ABCDE). Leave empty when there is only one MPPT on VE.Direct. With several,
; set it, so the other MPPTs stay with Victron's own driver.
serial_number =
; yes = ask Venus OS to stop its own VE.Direct driver on this port (that's what keeps DVCC away
; from the MPPT). no = only for people who have already blocked that driver some other way.
take_over = yes
; Seconds without data before the MPPT is shown as offline (it sends once a second)
timeout = 5.0

[dbus]
; dcsource = show the MPPT as a "DC source": in the device list and as a DC source box on the
; Overview. DVCC never controls DC sources. (Classes that DVCC controls, like solarcharger,
; are refused.)
service_class = dcsource
; Type of DC source on the Overview. -1 = generic source.
monitor_mode = -1
device_instance = 71
custom_name = Solar MPPT
; seconds between D-Bus updates
update_interval = 1.0
; yes = show the readings as cards in the GX switch pane, on the GX device page and in the
; VRM Switches panel / app widget (needs Venus OS v3.80 or newer)
switch_pane = yes

[web]
; Read-only web page with live values and charts: http://<gx-ip>:8090   (port = 0 disables it)
port = 8090
bind = 0.0.0.0
; Optional password for the web page (any user name). Empty = no password:
; anyone on your network can then see the readings (but not change anything).
password =
